name: CI Workflow - test & coverage & lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "*" ]


jobs:

  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.17.1]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.17.1]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      - name: Start backend
        run: docker compose up -d --wait --wait-timeout 60 --build

      - name: Check running containers
        run: |
          docker ps -a
          docker volume ls

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: run_tests
        continue-on-error: true
        run: npm run test:coverage

      - name: Check tests coverage
        if: steps.run_tests.outcome == 'failure'
        run: |
          echo "::error::❌ Jest coverage not meet."
          
          echo "### ❌ Jest coverage not meet: " >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The coverage percentage is lower than the minimum required limits configured in your project." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 **How to fix it?** Review the coverage report printed in the previous step, identify the untested files and add the corresponding unit tests before pushing your changes again." >> $GITHUB_STEP_SUMMARY

          exit 1
